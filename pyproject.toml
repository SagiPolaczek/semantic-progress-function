[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spf"
version = "0.1.0"
description = "Semantic Progress Function — measure perceptual progress in video"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "opencv-python",
    "Pillow",
    "tqdm",
    "open_clip_torch",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spf*"]
